[project]
name = "pyarch"
version = "0.1.0"
description = "A powerful Python binary reconstruction and analysis tool."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "pyinstaller",
]

[project.scripts]
pyarch = "pyarch.cli:app"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
package = true
